version: '3.9'

services:
  postgres:
    image: postgres:18
    container_name: postgresSanyukt
    ports:
      - "6501:5432"
    env_file:
      - ./app.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  apigateway:
    build:
      context: ./ApiGateway
    container_name: apigateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      user:
        condition: service_started
      userprofile:
        condition: service_started
      brillientstudent:
        condition: service_started
      imageupload:
        condition: service_started
      event:
        condition: service_started
      business:
        condition: service_started
    env_file:
      - ./app.env.docker
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-micro-service:8080
      PROFILE_SERVICE_URL: http://userprofile-service:8080
      BRILLIANT_STUDENT_URL: http://brillientstudent:8080
      IMAGE_UPLOAD_URL: http://imageupload:8080
      EVENTS_SERVICE_URL: http://event:8080
      BUSINESS_SERVICE_URL: http://business:8080

  auth-service:
    build:
      context: ./AuthService
    container_name: auth-service
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  brillientstudent:
    build:
      context: ./BrillientStudentAchievement
    container_name: brillientstudent
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  business:
    build:
      context: ./BusinessMicroservice
    container_name: business
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  imageupload:
    build:
      context: ./ImageUploadService
    container_name: imageupload
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  event:
    build:
      context: ./NamdevEvents
    container_name: event
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  user:
    build:
      context: ./UserMicroservice
    container_name: user-micro-service
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

  userprofile:
    build:
      context: ./UserProfileMicroservice
    container_name: userprofile-service
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env.docker

volumes:
  postgres_data:
