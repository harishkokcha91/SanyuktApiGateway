services:
  postgres:
    image: postgres
    container_name: postgresSanyukt
    ports:
      - "6501:5432"
    # env_file:
    #   - ./app.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    # environment:
    #   - DB_HOST=postgres
    #   - DB_PORT=5432
    #   - DB_USER=postgres
    #   - DB_PASSWORD=yourpassword
    #   - DB_NAME=yourdbname

  namdev-events:
    build:
      context: ./namdev-events
      dockerfile: Dockerfile
    container_name: namdev-events
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    # environment:
    #   - DB_HOST=postgres
    #   - DB_PORT=5432
    #   - DB_USER=postgres
    #   - DB_PASSWORD=yourpassword
    #   - DB_NAME=yourdbname

volumes:
  postgres_data:
